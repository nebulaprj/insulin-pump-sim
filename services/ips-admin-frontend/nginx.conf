# Этот файл включается в http-контекст глобального nginx.conf.
map $http_x_forwarded_proto $upstream_scheme {
    default $scheme;
    https   https;
}

server {
    listen       8080;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API прокси на backend (ips-backend)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_set_header Connection "";
    }

    # API прокси на сервис телеметрии (ips-telemetry-service)
    location /telemetry-api/ {
        proxy_pass http://telemetry:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_set_header Connection "";
    }

    # Ассеты с хэшами — кэш на год
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html — без кэша
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health-check
    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
