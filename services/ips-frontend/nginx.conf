# nginx.conf для фронтенда "Инсулиновая Помпа"
# Запуск: nginx -c $(pwd)/nginx.conf
# Или в Docker: COPY nginx.conf /etc/nginx/nginx.conf

# Master и рабочие процессы запускаются через USER nginx в Dockerfile
worker_processes  auto;

error_log  stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Сохраняем HTTPS-схему, когда TLS завершается на Caddy.
    # При прямом локальном HTTP-запросе используем текущую схему nginx.
    map $http_x_forwarded_proto $upstream_scheme {
        default $scheme;
        https   https;
    }

    # Логирование
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout main;

    # Временные файлы должны быть доступны непривилегированному процессу
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Производительность
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Размер тела запроса (для POST /settings, /alerts с телом)
    client_max_body_size 2m;

    # Gzip-сжатие
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Апстрим бэкенда FastAPI
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # Апстрим сервиса генератора (опционально, если используется напрямую)
    # upstream generator {
    #     server generator:8001;
    #     keepalive 32;
    # }

    server {
        listen       8080;
        server_name  localhost;

        # Корень статики — собранный фронтенд (Vite dist)
        root   /usr/share/nginx/html;
        index  index.html;

        # ---------- Проксирование API на бэкенд ----------
        location /api/ {
            proxy_pass http://backend/api/;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $upstream_scheme;

            # Поддержка Keep-Alive к апстриму
            proxy_set_header Connection "";

            # Таймауты
            proxy_connect_timeout 10s;
            proxy_send_timeout    15s;
            proxy_read_timeout    15s;

            # Не буферизовать ответы (для streaming и быстрых ответов)
            proxy_buffering off;
        }

        # ---------- Статические ассеты Vite с хэшами ----------
        # Файлы в /assets/ имеют хэши в именах (index-abc123.js),
        # поэтому их можно кэшировать на год.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Прочие статические файлы (favicon, иконки)
        location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # ---------- index.html никогда не кэшировать ----------
        # Это критично: при обновлении фронтенда пользователи должны сразу
        # получить новую версию HTML, чтобы загрузить новые JS-бандлы.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        # ---------- SPA fallback ----------
        # Все не-статические и не-API маршруты → index.html.
        # React Router обработает путь на клиенте.
        # Условие: если файл или папка существуют — отдаём их.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Запрет доступа к скрытым файлам (.git, .env и т.д.)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Health-check для мониторинга / балансировщиков
        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Security headers
        add_header X-Frame-Options        "SAMEORIGIN"       always;
        add_header X-Content-Type-Options "nosniff"          always;
        add_header X-XSS-Protection       "1; mode=block"    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }
}
